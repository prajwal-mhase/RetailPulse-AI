
[project]
name = "retailpulse-ai"
version = "1.0.0"
description = "AI-powered retail demand forecasting and inventory optimization"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "pandas",
    "numpy",
    "scikit-learn",
    "xgboost",
    "joblib",
    "pydantic",
    "python-dotenv",
]

[tool.vercel]
entrypoint = "api:app"
